[project]
name = "toyota"
description = "Toyota Connected Services EU community integration for Home Assistant"
license = "MIT"
version = "v2.5.0"
authors = [
  { name = "CM000n", email = "simon.hoerrle@gmail.com" },
  { name = "deejay1", email = "deejay1@srem.org" },
]
requires-python = '>=3.13.2,<3.15'
dynamic = ["dependencies"]

[tool.poetry]
package-mode = false
requires-poetry = '>=2.0'

[tool.poetry.dependencies]
arrow = "^1.3"
homeassistant = "^2026.0.0"
pytoyoda = "^5.1.0"

[tool.poetry.group.dev.dependencies]
homeassistant-stubs = "^2026.0.0"
pre-commit = "^4.1"
voluptuous-stubs = "^0.1"
pytest = "^9.0.0"
pytest-asyncio = "^1.0.0"
pytest-homeassistant-custom-component = "^0.13"
# aiodns 3.5.0 (pinned by homeassistant) references
# pycares.ares_query_a_result at class-definition time, an attribute removed
# in pycares 5.x. Cap pycares below 5 until aiodns/homeassistant move to a
# pycares-5-compatible release. See https://github.com/pytoyoda/ha_toyota/issues/347
pycares = "<5"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = "tests"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
fix = true
extend-exclude = ["tests"]
lint.select = ["ALL"]
lint.extend-ignore = ["D203", "D213", "COM812"]
# diagnostics.py is a redacting serializer over arbitrary pytoyoda objects:
# typing.Any is intrinsic (ANN401) and _jsonify is a type-dispatch with many
# returns (PLR0911). Scope the allowance to that one file.
lint.per-file-ignores = { "custom_components/toyota/diagnostics.py" = ["ANN401", "PLR0911"], "custom_components/toyota/sensor_extra.py" = ["ANN401"] }
lint.pydocstyle.convention = "google"
format.docstring-code-format = true
