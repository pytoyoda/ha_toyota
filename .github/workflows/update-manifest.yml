---
name: Release

on:
  release:
    types:
      - published

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: ⤵️ Check out code from GitHub
        uses: actions/checkout@v7

      - name: 🔢 Adjust version number
        shell: bash
        run: |
          version="${{ github.event.release.tag_name }}"
          version="${version,,}"
          version="${version#v}"
          yq e -P -o=json \
            -i ".version = \"${version}\"" \
            "${{ github.workspace }}/custom_components/toyota/manifest.json"

      - name: 📦 Created zipped release package
        shell: bash
        run: |
          cd "${{ github.workspace }}/custom_components/toyota"
          zip toyota.zip -r ./

      - name: 🔏 Sign release package
        uses: sigstore/gh-action-sigstore-python@v3.5.0
        with:
          inputs: ${{ github.workspace }}/custom_components/toyota/toyota.zip
          release-signing-artifacts: false

      - name: ⬆️ Upload zip to release
        uses: softprops/action-gh-release@v3.0.3
        with:
          files: ${{ github.workspace }}/custom_components/toyota/toyota.zip

        # Upload this one in the future, currently problematic for HACS
        # https://github.com/frenck/spook/issues/286
        # ${{ github.workspace }}/custom_components/spook/spook.zip.sigstore

  sync-versions:
    name: Sync versions
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # custom_components/toyota/manifest.json and pyproject.toml above are
      # only bumped in the ephemeral checkout used to build the release zip,
      # so the version committed to git keeps drifting away from the
      # actually published release (see #413). This job closes that gap by
      # pushing the version bump straight to main.
      #
      # main requires a reviewed pull request for the default GITHUB_TOKEN,
      # but repo admins are exempt from that rule, so this checks out and
      # pushes using RELEASE_MAIN_PUSH_TOKEN, a fine-grained PAT (Contents:
      # Read and write only) belonging to a repo admin, kept as a repository
      # secret.
      - name: ⤵️ Check out main
        uses: actions/checkout@v7
        with:
          ref: main
          token: ${{ secrets.RELEASE_MAIN_PUSH_TOKEN }}

      - name: 🔢 Determine released version
        id: version
        shell: bash
        run: |
          version="${{ github.event.release.tag_name }}"
          version="${version,,}"
          version="${version#v}"
          echo "value=${version}" >> "$GITHUB_OUTPUT"

      - name: 🐍 Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: ⚙️ Install Poetry
        uses: abatilo/actions-poetry@v4.0.0

      - name: 🔧 Bump manifest.json and pyproject.toml
        id: bump
        shell: bash
        run: |
          version="${{ steps.version.outputs.value }}"

          yq e -P -o=json -i ".version = \"${version}\"" custom_components/toyota/manifest.json
          poetry version "${version}"

          if git diff --quiet -- custom_components/toyota/manifest.json pyproject.toml; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: ⬆️ Push version bump to main
        if: steps.bump.outputs.changed == 'true'
        shell: bash
        run: |
          version="${{ steps.version.outputs.value }}"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add custom_components/toyota/manifest.json pyproject.toml
          git commit -m "chore: sync version to ${version} after release"
          git pull --rebase origin main
          git push origin HEAD:main
