name: "Test code"

env:
  COLUMNS: 120

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  pytest:
    name: "Pytest"
    runs-on: "ubuntu-latest"
    permissions:
      contents: read
    steps:
      - name: "⤵️ Check out code from GitHub"
        uses: "actions/checkout@v7"
        with:
          fetch-depth: 0 # Shallow clones should be disabled for a better relevancy of analysis
      - name: "🐍 Set up Python"
        uses: "actions/setup-python@v7"
        with:
          python-version: "3.14"
      - name: "⚙️ Install Poetry"
        uses: "abatilo/actions-poetry@v4.0.0"
      - name: "⚙️ Install dependencies"
        run: "poetry install"
      - name: "🚀 Run pytest with coverage"
        run: |
          set -o pipefail
          poetry run pytest tests --junitxml=pytest.xml --cov-report=term-missing:skip-covered --cov=custom_components/toyota | tee pytest-coverage.txt
      - name: "⬆️ Archive pytest junitxml results"
        uses: actions/upload-artifact@v7
        with:
          name: pytest
          path: ./pytest.xml
          retention-days: 1
      - name: "⬆️ Archive pytest coverage results"
        uses: actions/upload-artifact@v7
        with:
          name: pytest-coverage
          path: ./pytest-coverage.txt
          retention-days: 1
      - name: "⬆️ Archive PR number"
        if: github.event_name == 'pull_request'
        run: echo "${{ github.event.number }}" > pr_number.txt
      - name: "⬆️ Upload PR number"
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: pr_number
          path: ./pr_number.txt
          retention-days: 1
