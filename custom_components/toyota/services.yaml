refresh_vehicle_status:
  name: Refresh vehicle status
  description: >
    Wakes the vehicle's cellular modem and fetches fresh door, lock, window
    and trunk state. Use sparingly - each call uses a small amount of
    cellular airtime and 12V battery. Recommended for use after returning
    home from a drive when you want the lock state to be visible quickly,
    or wired to an automation that triggers on a specific event.
    Works regardless of the integration's automatic refresh setting:
    if you have disabled "Refresh vehicle status remotely" or the gateway
    has auto-disabled it, this service still fires the POST so you can
    drive a fully manual refresh schedule from your own automations.
  fields:
    device_id:
      name: Vehicle
      description: The Toyota vehicle whose modem to wake.
      required: true
      selector:
        device:
          integration: toyota
    timeout_seconds:
      name: Timeout
      description: >
        How long to wait for the car to transmit fresh data after the wake
        request. Longer values give silent (deeply parked) cars more time
        to respond, but block the service call until the timeout expires.
      default: 60
      selector:
        number:
          min: 10
          max: 180
          step: 5
          unit_of_measurement: s

refresh_recent_trips:
  name: Refresh recent trips
  description: >
    Fetch the most recent N trips for the targeted vehicle and replace the
    per-vehicle 'Recent trips' sensor cache. Each call is one API request to
    /v1/trips with route data (a heavier payload than the standard cycle's
    summary-only call). Recommended use cases: a daily automation that fetches
    a fresh batch when max_recent_trips=0 (auto-fetch disabled), or a one-off
    cache refresh after changing max_recent_trips. Works regardless of
    max_recent_trips, so you can keep auto-fetch off and drive everything via
    automations.
  fields:
    device_id:
      name: Vehicle
      description: The Toyota vehicle whose recent-trips cache to refresh.
      required: true
      selector:
        device:
          integration: toyota
    limit:
      name: Limit
      description: >
        How many recent trips to fetch (1-50, Toyota API maximum). The cache
        is fully replaced - existing cached trips are discarded before the
        new batch is stored.
      required: true
      selector:
        number:
          min: 1
          max: 50
          step: 1
          mode: box

refresh_electric_realtime_status:
  name: Refresh electric realtime status
  description: >
    Wakes the vehicle to force a fresh read of the electric/EV realtime
    status (battery level, charging state, range). Use sparingly - each
    call uses cellular airtime and, per the underlying API, can drain a
    small amount of 12V battery if called too often.
  fields:
    device_id:
      name: Vehicle
      description: The Toyota vehicle whose electric realtime status to refresh.
      required: true
      selector:
        device:
          integration: toyota

start_climate:
  name: Start climate
  description: >
    Send a single consolidated remote climate-control start covering
    temperature, front/rear defrost, steering-wheel heater and seat-heater
    levels. Toyota enforces a strict per-ignition-cycle quota on remote
    climate starts (2 starts / 20 cumulative minutes between two physical
    ignition cycles); setting these one at a time via the individual
    switch/select entities each dispatches its own start and can exhaust
    that quota within seconds. Use this service from a script or automation
    to apply everything in one call - one start, regardless of how many
    fields you set. Any field left unset keeps the vehicle's last-read
    value unchanged.
  fields:
    device_id:
      name: Vehicle
      description: The Toyota vehicle to start climate control on.
      required: true
      selector:
        device:
          integration: toyota
    temperature:
      name: Temperature
      description: Target cabin temperature. Leave unset to keep the last-read value.
      selector:
        number:
          min: 18
          max: 29
          step: 1
          unit_of_measurement: "°"
    front_defroster:
      name: Front defroster
      description: Turn the front defroster on or off.
      selector:
        boolean:
    rear_defogger:
      name: Rear defogger
      description: Turn the rear defogger on or off.
      selector:
        boolean:
    steering_heater:
      name: Steering wheel heater
      description: Turn the steering-wheel heater on or off.
      selector:
        boolean:
    seat_heater_driver:
      name: Driver seat heater
      description: Driver seat heater level.
      selector:
        select:
          options:
            - "off"
            - low
            - medium
            - high
    seat_heater_passenger:
      name: Passenger seat heater
      description: Passenger seat heater level.
      selector:
        select:
          options:
            - "off"
            - low
            - medium
            - high
    seat_heater_rear_driver:
      name: Rear driver seat heater
      description: Rear driver-side seat heater level.
      selector:
        select:
          options:
            - "off"
            - low
            - medium
            - high
    seat_heater_rear_passenger:
      name: Rear passenger seat heater
      description: Rear passenger-side seat heater level.
      selector:
        select:
          options:
            - "off"
            - low
            - medium
            - high
    duration_minutes:
      name: Duration
      description: >
        How many minutes remote climate should run for. Leave unset to use
        Toyota's default duration.
      selector:
        number:
          min: 1
          max: 20
          step: 1
          unit_of_measurement: min

get_trip_route:
  name: Get trip route
  description: >
    Return the cached GPS route polyline for a single trip by id. Used by
    the journey-viewer-card to lazy-load route data per trip rather than
    receiving every cached trip's route in the sensor's state attributes
    (where with_route polylines for long drives can run hundreds of KB and
    overwhelm the recorder + state-machine + WebSocket pipeline).
    Read-only: does not call the Toyota API. The cache is populated by the
    smart-strategy stop-event lifecycle and the refresh_recent_trips service.
  fields:
    device_id:
      name: Vehicle
      description: The Toyota vehicle whose trips cache to read.
      required: true
      selector:
        device:
          integration: toyota
    trip_id:
      name: Trip ID
      description: >
        UUID of the trip whose route to return. Match the `id` field on
        any item in the recent_trips sensor's `trips` attribute.
      required: true
      selector:
        text:
